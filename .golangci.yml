version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - nilerr
    - errorlint
    - errname
    - forcetypeassert
    - contextcheck
    - exhaustive
    - forbidigo
    - nolintlint
    - gocognit
    - gocyclo
  settings:
    # The maintainability audit runs this linter separately so staged baseline
    # findings retain exact source identity; tests receive the same limit.
    funlen:
      lines: 80
      statements: -1
      ignore-comments: false
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    exhaustive:
      default-signifies-exhaustive: false
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: '^os\.Process\.(Signal|Kill)$'
          msg: "Direct process signals are prohibited outside the guardian lifetime implementation."
        - pattern: '^syscall\.(Kill|Setsid)$'
          msg: "Direct syscall signals and setsid are prohibited outside the guardian lifetime implementation."
        - pattern: '^unix\.Kill$'
          msg: "Direct process signals are prohibited outside the guardian lifetime implementation."
        - pattern: '^exec\.CommandContext$'
          msg: "exec.CommandContext defaults to Process.Kill; the guardian owns stopping and timeout."
        - pattern: '^exec\.Cmd\.WaitDelay$'
          msg: "Nonzero Cmd.WaitDelay can implicitly kill processes; the guardian owns stopping."
  exclusions:
    rules:
      - path: '^internal/lifetime/'
        linters:
          - forbidigo
        source: 'unix\.Kill'
