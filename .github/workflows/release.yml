name: Release

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Immutable distribution artifact from successful CI on main'
        required: true
        type: string
      resume_published:
        description: 'Observe an already published release and finish only the tap'
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-promotion
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified distribution
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Read the selected tested distribution artifact and its source run.
      actions: read
      # Publish the verified tag and release assets.
      contents: write
    steps:
      - name: Checkout trusted publication code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Publish the tested distribution bytes
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RESUME_PUBLISHED: ${{ inputs.resume_published }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 scripts/publish_development_candidate.py --output-dir "${RUNNER_TEMP}/distribution-publication"

      - name: Retain publication result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution-publication/receipt.json
          # Input/context refusals can happen before the invocation owns an output directory.
          if-no-files-found: ignore
          retention-days: 90
