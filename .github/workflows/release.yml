name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote or verify, for example v1.2.3'
        required: true
        type: string
      native_validation_run_id:
        description: 'Exact successful hosted native-proof validation run ID; required for promotion'
        required: false
        type: string
      accepted_native_failure:
        description: 'Owner-accepted known native failure for one exact release; leave empty for strict native promotion'
        required: false
        default: ''
        type: string
      resume_published:
        description: 'Verify an already published release and finish Homebrew; do not republish npm or GitHub'
        required: true
        default: false
        type: boolean
      publish_homebrew:
        description: 'Update the Homebrew tap after release promotion'
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-promotion
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Install pinned tools
        run: make tools

      - name: Run repository checks
        run: make check

      - name: Check the installable skill package
        run: make skill-package-check

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Only stable semantic version tags such as v1.2.3 can be released." >&2
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "v${package_version}" != "${TAG}" ]]; then
            echo "Tag ${TAG} must match package.json version ${package_version}." >&2
            exit 1
          fi
          release_commit="$(git rev-list -n 1 "${GITHUB_SHA}")"
          git -c 'credential.helper=!gh auth git-credential' fetch "https://github.com/${GITHUB_REPOSITORY}.git" \
            "main:refs/remotes/origin/main" --no-tags
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo 'Release tags must reference a commit reachable from origin/main.' >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing a conflicting release." >&2
            exit 1
          fi

      - name: Validate GoReleaser configuration
        run: bin/goreleaser check

      - name: Fetch and verify bundled Pueue artifacts
        run: ./scripts/fetch-pueue-assets.sh .release/pueue

      - name: Publish draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/goreleaser release --clean

      - name: Attest release checksums
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-checksums: ./dist/checksums.txt

  archive-smoke:
    if: ${{ github.event_name == 'push' }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout the release verification harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Verify and exercise the exact release archive
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/delegation-layer-archive-receipt.json
        run: |
          python3 scripts/verify_release_archive.py verify \
            --mode archive-smoke \
            --assets-dir "${RUNNER_TEMP}/delegation-layer-release" \
            --extract-dir "${RUNNER_TEMP}/delegation-layer-release/extracted" \
            --receipt "${RECEIPT}" \
            --tag "${TAG}" \
            --repo "${GH_REPO}" \
            --source-revision "${GITHUB_SHA}"

      - name: Retain the sanitized Linux/macOS archive receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-archive-receipt-${{ matrix.os }}
          path: ${{ runner.temp }}/delegation-layer-archive-receipt.json
          if-no-files-found: error
          retention-days: 30

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted promotion harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: .local/release-harness
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Validate exact proof and public installation prerequisites
        if: ${{ !inputs.resume_published }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NATIVE_VALIDATION_RUN_ID: ${{ inputs.native_validation_run_id }}
          ACCEPTED_NATIVE_FAILURE: ${{ inputs.accepted_native_failure }}
        run: |
          if [[ ! "${NATIVE_VALIDATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo 'native_validation_run_id is required for promotion.' >&2
            exit 1
          fi
          if [[ -n "${ACCEPTED_NATIVE_FAILURE}" ]]; then
            if [[ "${ACCEPTED_NATIVE_FAILURE}" != 'v0.1.32-macos-opencode-timeout-evidence' ]]; then
              echo 'accepted_native_failure is not a recognized owner-accepted exception.' >&2
              exit 1
            fi
            # One-off owner authorization: strict native acceptance did not pass for
            # v0.1.32. Accept only the exact retained history and proof bytes below.
            HARNESS_ROOT="${PWD}/.local/release-harness" python3 -I - <<'PY'
          import hashlib, os, re, sys
          from dataclasses import replace
          from pathlib import Path
          sys.path.insert(0, os.environ['HARNESS_ROOT'])
          from scripts.delegate_acceptance.native_evidence.public_contract import (
              MAX_PUBLIC_ZIP_BYTES, PublicProofError,
          )
          from scripts.delegate_acceptance.native_evidence.public_validation import (
              inspect_public_proof, validate_public_identity,
          )
          from scripts.delegate_acceptance.release_verification.assets import (
              gh_environment, resolve_release_identity,
          )
          from scripts.delegate_acceptance.release_verification.contract import VerificationError
          from scripts.delegate_acceptance.release_verification.github import GitHubClient, object_value
          from scripts.delegate_acceptance.release_verification.native_archive import archive_expectation
          from scripts.delegate_acceptance.release_verification.native_history import classify_native_history
          from scripts.delegate_acceptance.release_verification.native_remote_history import history_reports
          from scripts.delegate_acceptance.release_verification.native_reports import ReportScope
          from scripts.delegate_acceptance.release_verification.native_submission import (
              SubmissionIdentity, repository_identity, require_public_repository,
          )

          REPO, REPOSITORY_ID, TAG = 'hishamkaram/delegation-layer', 1368219645, 'v0.1.32'
          RUNTIME_REVISION = 'a6e8e103c688412e1ef8cb3db59624bd54fe7603'
          # Source-harness fingerprint of RUNTIME_REVISION that produced both proofs. This
          # workflow change alters the promotion harness fingerprint, so bind history to it.
          PROOF_SOURCE_HARNESS_SHA256 = '94b6d3b0139367adcb53a53a8b3207af7eb27cffbc1ed3c0a15835d169b4c228'
          SENDER_ID, MACOS_RUN, LINUX_RUN = 24391550, 39402274329, 39403240260
          SHARED = {'kind': 'native-proof-validation', 'repository_id': REPOSITORY_ID, 'tag': TAG,
                    'harness_revision': RUNTIME_REVISION, 'release_revision': RUNTIME_REVISION,
                    'run_attempt': 1, 'sender_id': SENDER_ID, 'admission': 'admitted',
                    'opencode_model': 'opencode/big-pickle', 'ccr_model': 'litellm-glm-5-2'}
          PROOFS = {
              MACOS_RUN: {'platform': 'Darwin', 'report': {
                  'proof_asset_id': 658890558, 'invocation_id': '1ea656aaecb78a5355ff3d8222c31e26',
                  'proof_sha256': '0d0ccbaed8076949616fb4b6e2116d1e6e777abb94d49ea669b6ad9596e5931a',
                  'verdict': 'fail', 'native_verdict': None, 'native_status': 'BLOCKED',
                  'stage': 'validate-native-facts', 'history': None,
                  'failure': {'code': 'native_acceptance_not_passing', 'stage': 'validate-native-facts'},
              }},
              LINUX_RUN: {'platform': 'Linux', 'report': {
                  'proof_asset_id': 658909723, 'invocation_id': '3638cd62f371dc38eae345dee9bb7247',
                  'proof_sha256': 'efa6375dd6f89a9313e481a2246a19325ddd1e00251ed617fd54dcf04b711950',
                  'verdict': 'pass', 'native_verdict': 'pass', 'native_status': 'PASS',
                  'stage': 'validate-history',
                  'history': {'allowed': False, 'reason': 'native_history_blocked', 'observed_attempts': 2},
                  'failure': {'code': 'native_history_blocked', 'stage': 'validate-history'},
              }},
          }


          def require(condition, code):
              if not condition:
                  raise VerificationError(code, 'accepted-native-failure')


          def verify_history(client):
              rows = history_reports(client, REPO, ReportScope(REPOSITORY_ID, TAG, RUNTIME_REVISION))
              require(sorted(row.observation.run_id for row in rows) == sorted(PROOFS),
                      'accepted_native_failure_history_mismatch')
              for row in rows:
                  run_id = row.observation.run_id
                  expected = {**SHARED, **PROOFS[run_id]['report'], 'run_id': run_id}
                  report = row.report or {}
                  require(row.observation.attempt == 1 and row.observation.admission == 'admitted'
                          and row.observation.verdict == expected['verdict']
                          and (row.status, row.conclusion) == ('completed', 'failure')
                          and all(report.get(key) == value for key, value in expected.items()),
                          'accepted_native_failure_report_mismatch')
              decision = classify_native_history(tuple(row.observation for row in rows),
                                                 complete=True, selected_run_id=LINUX_RUN)
              require(not decision.allowed and decision.reason == 'native_history_blocked'
                      and decision.blocking_attempts == ((MACOS_RUN, 1),),
                      'accepted_native_failure_policy_mismatch')


          def verify_proof_bytes(client):
              assets = client.release(REPO, TAG).get('assets')
              require(isinstance(assets, list), 'accepted_native_failure_assets_invalid')
              proofs = {}
              for run_id, proof in PROOFS.items():
                  expected = proof['report']
                  matches = [object_value(asset, 'accepted-native-failure') for asset in assets
                             if isinstance(asset, dict) and asset.get('id') == expected['proof_asset_id']]
                  require(len(matches) == 1, 'accepted_native_failure_asset_not_in_release')
                  uploader = object_value(matches[0].get('uploader'), 'accepted-native-failure')
                  name = matches[0].get('name')
                  pattern = rf"native-proof-{proof['platform']}-(amd64|arm64)-{expected['invocation_id']}\.zip"
                  require(uploader.get('id') == SENDER_ID and isinstance(name, str)
                          and re.fullmatch(pattern, name) is not None,
                          'accepted_native_failure_asset_mismatch')
                  data = client.bytes(f"repos/{REPO}/releases/assets/{expected['proof_asset_id']}",
                                      limit=MAX_PUBLIC_ZIP_BYTES)
                  require(hashlib.sha256(data).hexdigest() == expected['proof_sha256'],
                          'accepted_native_failure_proof_digest_mismatch')
                  proofs[run_id] = (name, data)
              return proofs


          def verify_archive_binding(client, proofs):
              base = Path(os.environ['RUNNER_TEMP']) / 'accepted-native-failure'
              base.mkdir(mode=0o700)
              for run_id, (name, data) in proofs.items():
                  proof, report = PROOFS[run_id], PROOFS[run_id]['report']
                  platform = object_value(inspect_public_proof(data)['platform'], 'accepted-native-failure')
                  arch = platform.get('arch')
                  require(platform.get('os') == proof['platform'] and isinstance(arch, str)
                          and name.endswith(f"-{arch}-{report['invocation_id']}.zip"),
                          'accepted_native_failure_platform_mismatch')
                  identity = SubmissionIdentity(
                      repository=REPO, repository_id=REPOSITORY_ID, release_revision=RUNTIME_REVISION,
                      harness_revision=RUNTIME_REVISION, sender_id=SENDER_ID,
                      asset_id=report['proof_asset_id'], proof_sha256=report['proof_sha256'], asset_name=name,
                  )
                  root = base / proof['platform']
                  root.mkdir(mode=0o700)
                  expectation = archive_expectation(
                      client, identity, tag=TAG, platform_os=proof['platform'], platform_arch=arch,
                      root=root, opencode_model=SHARED['opencode_model'], ccr_model=SHARED['ccr_model'],
                  )
                  # Current archive, checksum, attestation and binary hashes come from the helper;
                  # only the source fingerprint is the historical proof harness, never this workflow's.
                  validate_public_identity(data, replace(
                      expectation, source_harness_sha256=PROOF_SOURCE_HARNESS_SHA256))


          def summary(proofs):
              lines = [
                  f'## Owner-accepted native acceptance failure for {TAG}', '',
                  f'Strict native acceptance did not pass for runtime `{RUNTIME_REVISION}`. '
                  'The repository owner accepted this known risk for this release only; '
                  'this promotion is not a native acceptance pass.', '',
                  f"- Promotion harness: `{os.environ['GITHUB_SHA']}` (current protected main); "
                  f'proof harness: `{RUNTIME_REVISION}` (source fingerprint `{PROOF_SOURCE_HARNESS_SHA256}`).',
                  '- Both proofs were revalidated against the current release archive, checksums.txt, '
                  'release attestation and binary hashes for their platform.',
              ]
              for run_id, proof in PROOFS.items():
                  report, name = proof['report'], proofs[run_id][0]
                  lines.append(
                      f"- {proof['platform']}: [validation run {run_id}]"
                      f'(https://github.com/{REPO}/actions/runs/{run_id}) verdict `{report["verdict"]}`, '
                      f"native status `{report['native_status']}`, failure `{report['failure']['code']}` "
                      f"at `{report['failure']['stage']}`; proof [{name}]"
                      f'(https://github.com/{REPO}/releases/download/{TAG}/{name}) '
                      f"asset `{report['proof_asset_id']}`, SHA-256 `{report['proof_sha256']}`.")
              lines.extend([
                  '- Known macOS failure: in `case-17-opencode-run-workspace-write-timeout-resume` the '
                  'expected timeout occurred, then the parent FIFO had extra or malformed evidence before '
                  'continuation was invoked. Lifecycle is unresolved and the evidence is retained.',
                  '- Two Pi cases on macOS were BLOCKED because Pi was not discoverable; this neutral '
                  'prerequisite is allowed and does not replace the known failure above.',
              ])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write('\n'.join(lines) + '\n')


          try:
              require(os.environ['GITHUB_REPOSITORY'] == REPO and os.environ['TAG'] == TAG,
                      'accepted_native_failure_scope_mismatch')
              require(os.environ['NATIVE_VALIDATION_RUN_ID'] == str(LINUX_RUN),
                      'accepted_native_failure_selected_run_mismatch')
              client = GitHubClient({'commands': []}, gh_environment())
              require(repository_identity(client, REPO, os.environ['GITHUB_SHA']) == REPOSITORY_ID,
                      'accepted_native_failure_repository_mismatch')
              require_public_repository(client, REPO)
              release = resolve_release_identity(REPO, TAG, client.receipt, client.environment)
              require(release['commit_sha'] == RUNTIME_REVISION, 'accepted_native_failure_revision_mismatch')
              verify_history(client)
              proofs = verify_proof_bytes(client)
              verify_archive_binding(client, proofs)
              summary(proofs)
          except VerificationError as error:
              print(f'Accepted native failure validation failed: {error.code} ({error.stage})', file=sys.stderr)
              raise SystemExit(1)
          except PublicProofError as error:
              print(f'Accepted native failure validation failed: {error} (proof-identity)', file=sys.stderr)
              raise SystemExit(1)
          PY
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/native-promotion"
          python3 .local/release-harness/scripts/validate_native_release.py promotion \
            --tag "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --source-revision "${GITHUB_SHA}" \
            --native-validation-run-id "${NATIVE_VALIDATION_RUN_ID}" \
            --work-dir "${RUNNER_TEMP}/native-promotion"

      - name: Validate already published release
        if: ${{ inputs.resume_published }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ACCEPTED_NATIVE_FAILURE: ${{ inputs.accepted_native_failure }}
        run: |
          if [[ -n "${ACCEPTED_NATIVE_FAILURE}" ]]; then
            echo 'accepted_native_failure applies only to promotion, not resume_published.' >&2
            exit 1
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" != "false" ]]; then
            echo 'Consumer recovery requires a public repository.' >&2
            exit 1
          fi
          ready="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.draft == false and .prerelease == false')"
          if [[ "${ready}" != "true" ]]; then
            echo 'Consumer recovery requires an already published stable release.' >&2
            exit 1
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" != "${TAG}" ]]; then
            echo 'Consumer recovery requires the latest stable release to prevent a tap downgrade.' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Validate release prerequisites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PUBLISH_HOMEBREW: ${{ inputs.publish_homebrew }}
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo 'Promotion must be dispatched from protected main.' >&2
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo 'Only stable semantic version tags such as v1.2.3 can be promoted.' >&2
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "v${package_version}" != "${TAG}" ]]; then
            echo "Tag ${TAG} must match package.json version ${package_version}." >&2
            exit 1
          fi
          if [[ "${PUBLISH_HOMEBREW}" == "true" && -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo 'HOMEBREW_TAP_TOKEN is required when publish_homebrew is true.' >&2
            exit 1
          fi
          release_state="$(gh release view "${TAG}" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          IFS=$'\t' read -r draft prerelease <<<"${release_state}"
          if [[ "${prerelease}" == "true" ]]; then
            echo "Release ${TAG} is a prerelease; refusing promotion." >&2
            exit 1
          fi
          if ! latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .prerelease == false)] | if length == 0 then "" else max_by(.published_at).tag_name end')"; then
            echo 'Unable to determine the current latest stable release; refusing promotion.' >&2
            exit 1
          fi
          if [[ "${draft}" == "true" ]]; then
            if [[ -n "${latest_tag}" && "${latest_tag}" != "${TAG}" ]] && ! node - "${TAG}" "${latest_tag}" <<'NODE'
          const [, currentMajor, currentMinor, currentPatch] = process.argv[2].match(/^v(\d+)\.(\d+)\.(\d+)$/) || [];
          const [, latestMajor, latestMinor, latestPatch] = process.argv[3].match(/^v(\d+)\.(\d+)\.(\d+)$/) || [];
          if (currentMajor === undefined || latestMajor === undefined) process.exit(1);
          const current = [currentMajor, currentMinor, currentPatch].map(Number);
          const latest = [latestMajor, latestMinor, latestPatch].map(Number);
          let newer = false;
          for (let index = 0; index < current.length; index += 1) {
            if (current[index] === latest[index]) continue;
            newer = current[index] > latest[index];
            break;
          }
          process.exit(newer ? 0 : 1);
          NODE
            then
              echo "Draft release ${TAG} is not newer than current latest release ${latest_tag}; refusing promotion." >&2
              exit 1
            fi
          fi
          release_commit="$(git rev-list -n 1 "${TAG}^{commit}")"
          git -c 'credential.helper=!gh auth git-credential' fetch "https://github.com/${GITHUB_REPOSITORY}.git" \
            "main:refs/remotes/origin/main" \
            "${WORKFLOW_SHA}:refs/remotes/origin/workflow" --no-tags
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo 'Promotion tags must reference a commit reachable from origin/main.' >&2
            exit 1
          fi
          push_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=push&head_sha=${release_commit}&per_page=20" \
            --jq 'if (.workflow_runs | length) == 0 then "" else [.workflow_runs[0].status, .workflow_runs[0].conclusion, .workflow_runs[0].head_sha] | @tsv end')"
          if [[ -z "${push_run}" ]]; then
            echo "No tag-triggered release workflow run found for ${TAG}." >&2
            exit 1
          fi
          IFS=$'\t' read -r push_status push_conclusion push_head_sha <<<"${push_run}"
          if [[ "${push_status}" != "completed" || "${push_conclusion}" != "success" || "${push_head_sha}" != "${release_commit}" ]]; then
            echo "Tag-triggered release and archive smoke checks are not complete and successful for ${TAG}." >&2
            exit 1
          fi
          if [[ "${draft}" != "true" ]]; then
            if [[ "${latest_tag}" != "${TAG}" ]]; then
              echo "Release ${TAG} is public but not the current latest release; refusing promotion." >&2
              exit 1
            fi
            echo "Release ${TAG} is already public and current; continuing an idempotent promotion retry."
          fi
          if ! gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -Fx checksums.txt >/dev/null; then
            echo "Release ${TAG} is missing checksums.txt." >&2
            exit 1
          fi
      - name: Configure npm credentials
        if: ${{ !inputs.resume_published }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo 'NPM_TOKEN is required to promote the public npm package.' >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${RUNNER_TEMP}/npmrc"
          chmod 0600 "${RUNNER_TEMP}/npmrc"

      - name: Publish or verify npm package
        if: ${{ !inputs.resume_published }}
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          TAG: ${{ inputs.tag }}
        run: |
          package="delegation-layer@${TAG#v}"
          package_dir="${RUNNER_TEMP}/package"
          mkdir -p "${package_dir}"
          npm pack --ignore-scripts --json --pack-destination "${package_dir}" > "${RUNNER_TEMP}/pack.json"
          package_tarball="$(node -p "Object.values(JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/pack.json', 'utf8')))[0].filename")"
          package_integrity="$(node -p "Object.values(JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/pack.json', 'utf8')))[0].integrity")"
          published_integrity="$(npm view "${package}" dist.integrity 2>/dev/null || true)"
          if [[ -n "${published_integrity}" ]]; then
            if [[ "${published_integrity}" != "${package_integrity}" ]]; then
              echo "npm package version ${package} already exists with different contents." >&2
              exit 1
            fi
            echo "npm package version ${package} is already published with matching contents."
            exit 0
          fi
          npm publish "${package_dir}/${package_tarball}" --access public --provenance
          for attempt in {1..60}; do
            published_integrity="$(npm view "${package}" dist.integrity 2>/dev/null || true)"
            if [[ "${published_integrity}" == "${package_integrity}" ]]; then
              echo "npm package version ${package} is visible with matching contents."
              exit 0
            fi
            sleep 20
          done
          echo "npm package version ${package} was published but did not become visible with matching contents after ${attempt} checks." >&2
          exit 1

      - name: Publish GitHub Release
        if: ${{ !inputs.resume_published }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "${TAG}" --draft=false --latest


  published-npm:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: promote
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/release-consumer.yml
    with:
      os: ${{ matrix.os }}
      channel: npm
      tag: ${{ inputs.tag }}

  publish-homebrew:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_homebrew && github.ref == 'refs/heads/main' }}
    needs: published-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout trusted tap publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish exact verified formula
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: ./scripts/publish-homebrew-formula.sh "${TAG}"

  published-homebrew:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_homebrew && github.ref == 'refs/heads/main' }}
    needs: publish-homebrew
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/release-consumer.yml
    with:
      os: macos-15
      channel: homebrew
      tag: ${{ inputs.tag }}
