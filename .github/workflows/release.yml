name: Release

run-name: Candidate publication ${{ inputs.invocation_id }} ${{ inputs.request_sha256 }}

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Frozen candidate ID (64 lowercase hex)'
        required: true
        type: string
      freeze_commit:
        description: 'Evidence store commit that froze the candidate'
        required: true
        type: string
      merged_commit:
        description: 'Squash merge commit M on main'
        required: true
        type: string
      readiness_run_id:
        description: 'Selected development readiness run ID'
        required: true
        type: string
      readiness_run_attempt:
        description: 'Selected development readiness run attempt'
        required: true
        type: string
      resume_published:
        description: 'Exactly true or false; true only observes and finishes an already published candidate'
        required: true
        type: string
      invocation_id:
        description: 'Root publication invocation ID (32 lowercase hex)'
        required: true
        type: string
      request_sha256:
        description: 'SHA-256 of the canonical publication request'
        required: true
        type: string
      harness:
        description: 'Trusted main publication code revision H; must equal this run head'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-promotion
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout trusted publication harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Publish exact candidate bytes
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          FREEZE_COMMIT: ${{ inputs.freeze_commit }}
          MERGED_COMMIT: ${{ inputs.merged_commit }}
          READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
          READINESS_RUN_ATTEMPT: ${{ inputs.readiness_run_attempt }}
          RESUME_PUBLISHED: ${{ inputs.resume_published }}
          INVOCATION_ID: ${{ inputs.invocation_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          HARNESS: ${{ inputs.harness }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 scripts/publish_development_candidate.py --output-dir "${RUNNER_TEMP}/candidate-publication"

      - name: Retain the publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-publication/receipt.json
          if-no-files-found: error
          retention-days: 90
