name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag to promote, for example v0.1.2'
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Install pinned tools
        run: make tools

      - name: Run repository checks
        run: make check

      - name: Check the installable skill package
        run: make skill-package-check

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Only stable semantic version tags such as v0.1.2 can be released." >&2
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "v${package_version}" != "${TAG}" ]]; then
            echo "Tag ${TAG} must match package.json version ${package_version}." >&2
            exit 1
          fi
          release_commit="$(git rev-list -n 1 "${GITHUB_SHA}")"
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "main:refs/remotes/origin/main" --no-tags
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo 'Release tags must reference a commit reachable from origin/main.' >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing a conflicting release." >&2
            exit 1
          fi

      - name: Validate GoReleaser configuration
        run: bin/goreleaser check

      - name: Publish draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/goreleaser release --clean

      - name: Attest release checksums
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-checksums: ./dist/checksums.txt

  archive-smoke:
    if: ${{ github.event_name == 'push' }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download and verify draft archive
        shell: bash
        run: |
          release_dir="${RUNNER_TEMP}/release"
          mkdir -p "${release_dir}"
          gh release download "${TAG}" \
            --repo "${GH_REPO}" \
            --pattern 'delegation-layer_*.tar.gz' \
            --pattern checksums.txt \
            --dir "${release_dir}"
          cd "${release_dir}"
          case "$(uname -s)" in
            Linux) os=Linux ;;
            Darwin) os=Darwin ;;
            *) echo "Unsupported operating system: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="delegation-layer_${TAG#v}_${os}_${arch}.tar.gz"
          test -f "${archive}"
          checksum_line="$(grep -F "  ${archive}" checksums.txt)"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s\n' "${checksum_line}" | sha256sum -c -
          else
            printf '%s\n' "${checksum_line}" | shasum -a 256 -c -
          fi
          gh attestation verify "${archive}" \
            --repo "${GH_REPO}" \
            --signer-workflow "${GH_REPO}/.github/workflows/release.yml"
          mkdir extracted
          tar -xzf "${archive}" -C extracted
          cd extracted
          test "$(./delegate version | awk '{print $2}')" = "${TAG#v}"
          ./delegate providers --json >/dev/null
          ./delegate capabilities --provider pi:json --json >/dev/null
          test -x ./delegate-run
          if ./delegate-run --root "${RUNNER_TEMP}/missing-state" invalid-task --json >/dev/null 2>&1; then
            echo 'delegate-run unexpectedly accepted an invalid task invocation.' >&2
            exit 1
          fi

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout draft tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Validate draft and npm credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo 'Only stable semantic version tags such as v0.1.2 can be promoted.' >&2
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "v${package_version}" != "${TAG}" ]]; then
            echo "Tag ${TAG} must match package.json version ${package_version}." >&2
            exit 1
          fi
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo 'NPM_TOKEN is required to promote the public npm package.' >&2
            exit 1
          fi
          draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
          if [[ "${draft}" != "true" ]]; then
            echo "Release ${TAG} is not a draft; refusing promotion." >&2
            exit 1
          fi
          if ! gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -Fx checksums.txt >/dev/null; then
            echo "Release ${TAG} is missing checksums.txt." >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${RUNNER_TEMP}/npmrc"
          chmod 0600 "${RUNNER_TEMP}/npmrc"

      - name: Publish or verify npm package
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          TAG: ${{ inputs.tag }}
        run: |
          package="delegation-layer@${TAG#v}"
          package_dir="${RUNNER_TEMP}/package"
          mkdir -p "${package_dir}"
          npm pack --ignore-scripts --json --pack-destination "${package_dir}" > "${RUNNER_TEMP}/pack.json"
          package_tarball="$(node -p "Object.values(JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/pack.json', 'utf8')))[0].filename")"
          package_integrity="$(node -p "Object.values(JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/pack.json', 'utf8')))[0].integrity")"
          published_integrity="$(npm view "${package}" dist.integrity 2>/dev/null || true)"
          if [[ -n "${published_integrity}" ]]; then
            if [[ "${published_integrity}" != "${package_integrity}" ]]; then
              echo "npm package version ${package} already exists with different contents." >&2
              exit 1
            fi
            echo "npm package version ${package} is already published with matching contents."
            exit 0
          fi
          npm publish "${package_dir}/${package_tarball}" --access public --provenance

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "${TAG}" --draft=false --latest
