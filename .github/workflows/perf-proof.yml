name: Temporary app timing proof

on:
  push:
    branches: ["maintenance/quality-followups"]

permissions:
  contents: read

jobs:
  timing:
    name: Paired app timing (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout the proof commit and its source baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned Go compiler
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: '.go-version'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Run the single isolated timing experiment
        env:
          GOTOOLCHAIN: local
        run: >-
          python3 .github/quality_timing_proof.py
          --base fe8448ede0b80348559293d6f7349ee71635c024
          --output "${RUNNER_TEMP}/quality-timing-proof"

      - name: Retain bounded timing and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-timing-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quality-timing-proof/*.json
            ${{ runner.temp }}/quality-timing-proof/*.stdout
            ${{ runner.temp }}/quality-timing-proof/*.stderr
            ${{ runner.temp }}/quality-timing-proof/source-data/**/*.go
          if-no-files-found: error
          retention-days: 7
          overwrite: false
