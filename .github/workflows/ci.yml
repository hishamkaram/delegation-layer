name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  skill-package:
    name: Agent skill package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Check the installable skill package
        run: make skill-package-check

  gate-linux:
    name: Gate (Linux ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Log environment details
        run: |
          uname -a
          go version
          go env GOHOSTOS GOHOSTARCH

      - name: Install tools
        run: make tools

      - name: Run gate checks
        run: make check

      - name: Prove selected native lifetime backend
        env:
          DELEGATE_NATIVE_LIFETIME_RECEIPT: bin/native-lifetime-proof/receipt.json
        run: make acceptance-native-lifetime

      - name: Retain native lifetime proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-lifetime-${{ runner.os }}-${{ github.run_attempt }}
          path: bin/native-lifetime-proof/receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Run protocol acceptance
        run: make acceptance-protocol

      - name: Install pinned supervisor test binaries
        run: ./scripts/install-test-supervisor.sh

      - name: Prove private supervisor bootstrap through delegate CLI
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-private-cli

      - name: Prove external inspection handoff through delegate CLI
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-supervisor-handoff

      - name: Retain allowlisted private CLI acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-cli-receipts-${{ runner.os }}-${{ github.run_attempt }}
          path: bin/private-cli-acceptance.*/receipt.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Run supervisor acceptance
        id: supervisor
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-supervisor

      - name: Archive supervisor failure evidence
        if: failure() && steps.supervisor.outcome == 'failure'
        run: tar -czf "${{ runner.temp }}/supervisor-failure-evidence.tar.gz" bin/supervisor-acceptance

      - name: Retain supervisor failure evidence
        if: failure() && steps.supervisor.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supervisor-failure-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supervisor-failure-evidence.tar.gz
          retention-days: 7
          if-no-files-found: error

  gate-macos:
    name: Gate (macOS macos-15)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Log environment details
        run: |
          uname -a
          go version
          go env GOHOSTOS GOHOSTARCH

      - name: Install tools
        run: make tools

      - name: Run gate checks
        run: make check

      - name: Prove selected native lifetime backend
        env:
          DELEGATE_NATIVE_LIFETIME_RECEIPT: bin/native-lifetime-proof/receipt.json
        run: make acceptance-native-lifetime

      - name: Retain native lifetime proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-lifetime-${{ runner.os }}-${{ github.run_attempt }}
          path: bin/native-lifetime-proof/receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Run protocol acceptance
        run: make acceptance-protocol

      - name: Install pinned supervisor test binaries
        run: ./scripts/install-test-supervisor.sh

      - name: Prove private supervisor bootstrap through delegate CLI
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-private-cli

      - name: Prove external inspection handoff through delegate CLI
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-supervisor-handoff

      - name: Retain allowlisted private CLI acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-cli-receipts-${{ runner.os }}-${{ github.run_attempt }}
          path: bin/private-cli-acceptance.*/receipt.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Run supervisor acceptance
        id: supervisor
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-supervisor

      - name: Archive supervisor failure evidence
        if: failure() && steps.supervisor.outcome == 'failure'
        run: tar -czf "${{ runner.temp }}/supervisor-failure-evidence.tar.gz" bin/supervisor-acceptance

      - name: Retain supervisor failure evidence
        if: failure() && steps.supervisor.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supervisor-failure-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supervisor-failure-evidence.tar.gz
          retention-days: 7
          if-no-files-found: error
