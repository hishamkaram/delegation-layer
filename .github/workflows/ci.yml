name: CI
run-name: ${{ inputs.native_startup_component_only && 'Native infrastructure component proof only' || github.workflow }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      native_startup_component_only:
        description: 'Run only native infrastructure component proofs; does not establish full CI or PR readiness'
        required: false
        default: false
        type: boolean
      build_candidate:
        description: 'Build distribution artifacts from this branch, including main'
        required: false
        default: false
        type: boolean
      candidate_version:
        description: 'Expected package version of the candidate, for example 1.2.3'
        required: false
        default: ''
        type: string
      candidate_base_commit:
        description: 'Build base commit (defaults to the source commit)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout complete change history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Select checks from the complete change
        id: scope
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: >-
          python3 scripts/ci_scope.py --event "$CHANGE_EVENT"
          --base "$CHANGE_BASE" --head "$CHANGE_HEAD" --output "$GITHUB_OUTPUT"

  skill-package-linux:
    if: ${{ !inputs.native_startup_component_only }}
    name: Agent skill package (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up minimum Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18.x'

      - name: Check the installable skill package on Node 18
        run: make skill-package-check

  skill-package-macos:
    name: Agent skill package (macos-15)
    needs: changes
    if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up minimum Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18.x'
      - name: Check the installable skill package on Node 18
        run: make skill-package-check

  gate-linux:
    name: Gate (Linux ubuntu-24.04)
    needs: changes
    if: ${{ always() && !inputs.native_startup_component_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require a valid check selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          test "$SELECTION_RESULT" = success || { echo 'Change selection did not succeed'; exit 1; }
          case "$FULL" in true|false) ;; *) echo 'Change selection returned an invalid scope'; exit 1 ;; esac

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: '.go-version'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Log environment details
        run: |
          uname -a
          go version
          go env GOHOSTOS GOHOSTARCH
          python3 --version

      - name: Install tools
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        run: make tools

      - name: Run gate checks
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        run: make check

      - name: Check documentation, skills and diagrams
        if: ${{ needs.changes.outputs.full == 'false' }}
        run: make check-docs

      - name: Prove selected native lifetime backend
        id: native_lifetime
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        env:
          DELEGATE_NATIVE_LIFETIME_RECEIPT: bin/native-lifetime-proof/receipt.json
        run: make acceptance-native-lifetime

      - name: Retain native lifetime proof receipt
        if: >-
          always() && (steps.native_lifetime.outcome == 'success' ||
          steps.native_lifetime.outcome == 'failure' ||
          steps.native_lifetime.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-lifetime-${{ runner.os }}-${{ github.run_attempt }}
          path: bin/native-lifetime-proof/receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Run protocol acceptance
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        run: make acceptance-protocol

      - name: Install pinned supervisor test binaries
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        run: ./scripts/install-test-supervisor.sh

      - name: Prove private supervisor bootstrap through delegate CLI
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-private-cli

      - name: Prove external inspection handoff through delegate CLI
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-supervisor-handoff

      - name: Prove private supervisor upgrade recovery through delegate CLI
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        run: make acceptance-supervisor-upgrade-recovery

      - name: Prove default user and budget stops through delegate CLI
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-private-cli-default-stop

      - name: Retain allowlisted private CLI acceptance receipts
        if: ${{ always() && needs.changes.outputs.full == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-cli-receipts-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            bin/private-cli-acceptance.*/receipt.json
            bin/private-cli-acceptance.*/receipt.json.responses/status-default-stop-*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Prove managed workspace fixtures through delegate CLI
        id: workspaces
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-workspaces

      - name: Retain managed workspace acceptance receipts
        if: >-
          always() && (steps.workspaces.outcome == 'success' ||
          steps.workspaces.outcome == 'failure' ||
          steps.workspaces.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-workspace-receipts-${{ runner.os }}-${{ github.run_attempt }}
          path: bin/managed-workspace-acceptance.*/receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Run supervisor acceptance
        id: supervisor
        if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-supervisor

      - name: Archive supervisor failure evidence
        if: failure() && steps.supervisor.outcome == 'failure'
        run: tar -czf "$RUNNER_TEMP/supervisor-failure-evidence.tar.gz" bin/supervisor-acceptance

      - name: Retain supervisor failure evidence
        if: failure() && steps.supervisor.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supervisor-failure-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supervisor-failure-evidence.tar.gz
          retention-days: 7
          if-no-files-found: error

  gate-macos:
    name: Gate (macOS macos-15)
    needs: changes
    if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: '.go-version'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Log environment details
        run: |
          uname -a
          go version
          go env GOHOSTOS GOHOSTARCH
          python3 --version

      - name: Install platform tools
        run: make tools-go

      - name: Run platform gate checks
        run: make check-platform

      - name: Prove selected native lifetime backend
        id: native_lifetime
        env:
          DELEGATE_NATIVE_LIFETIME_RECEIPT: bin/native-lifetime-proof/receipt.json
        run: make acceptance-native-lifetime

      - name: Retain native lifetime proof receipt
        if: >-
          always() && (steps.native_lifetime.outcome == 'success' ||
          steps.native_lifetime.outcome == 'failure' ||
          steps.native_lifetime.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-lifetime-${{ runner.os }}-${{ github.run_attempt }}
          path: bin/native-lifetime-proof/receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Run protocol acceptance
        run: make acceptance-protocol

      - name: Install pinned supervisor test binaries
        run: ./scripts/install-test-supervisor.sh

      - name: Prove private supervisor bootstrap through delegate CLI
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-private-cli

      - name: Prove external inspection handoff through delegate CLI
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-supervisor-handoff

      - name: Prove private supervisor upgrade recovery through delegate CLI
        run: make acceptance-supervisor-upgrade-recovery

      - name: Prove default user and budget stops through delegate CLI
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-private-cli-default-stop

      - name: Retain allowlisted private CLI acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-cli-receipts-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            bin/private-cli-acceptance.*/receipt.json
            bin/private-cli-acceptance.*/receipt.json.responses/status-default-stop-*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Prove managed workspace fixtures through delegate CLI
        id: workspaces
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-workspaces

      - name: Retain managed workspace acceptance receipts
        if: >-
          always() && (steps.workspaces.outcome == 'success' ||
          steps.workspaces.outcome == 'failure' ||
          steps.workspaces.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-workspace-receipts-${{ runner.os }}-${{ github.run_attempt }}
          path: bin/managed-workspace-acceptance.*/receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Run supervisor acceptance
        id: supervisor
        env:
          DELEGATE_TEST_PUEUE: ${{ github.workspace }}/bin/test-supervisor/pueue
          DELEGATE_TEST_PUEUED: ${{ github.workspace }}/bin/test-supervisor/pueued
        run: make acceptance-supervisor

      - name: Archive supervisor failure evidence
        if: failure() && steps.supervisor.outcome == 'failure'
        run: tar -czf "$RUNNER_TEMP/supervisor-failure-evidence.tar.gz" bin/supervisor-acceptance

      - name: Retain supervisor failure evidence
        if: failure() && steps.supervisor.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supervisor-failure-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supervisor-failure-evidence.tar.gz
          retention-days: 7
          if-no-files-found: error

  independent-startup-component:
    name: Native infrastructure component (${{ matrix.os }})
    needs: changes
    if: ${{ inputs.native_startup_component_only || needs.changes.outputs.full == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Install pinned repository tools
        run: make tools
      - name: Prove native infrastructure components only
        shell: bash
        env:
          DELEGATE_INDEPENDENT_EXPECTED_BACKEND: process-group
        run: |
          mkdir -p bin/independent-startup-proof
          make acceptance-independent-startup 2>&1 | tee bin/independent-startup-proof/native.log
      - name: Retain bounded native component output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-startup-component-${{ matrix.os }}-${{ github.run_attempt }}
          path: bin/independent-startup-proof/native.log
          retention-days: 7
          if-no-files-found: error

  nested-survival:
    name: Nested survival (${{ matrix.os }})
    needs: changes
    if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned tools and supervisor
        run: |
          make tools
          ./scripts/install-test-supervisor.sh
      - name: Prove warm controls and cold nested survival
        env:
          DELEGATE_NESTED_EXPECTED_BACKEND: process-group
        run: make acceptance-nested-survival
      - name: Retain allowlisted nested survival receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nested-survival-${{ matrix.os }}-${{ github.run_attempt }}
          path: bin/nested-survival.*/receipt.json
          retention-days: 7
          if-no-files-found: error

  development-candidate:
    name: Distribution build
    needs: changes
    if: >-
      ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' && ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_candidate && github.ref_type == 'branch')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: '.go-version'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Install pinned tools
        run: make tools

      - name: Verify pinned tool versions
        run: make tool-versions

      - name: Build the candidate from the clean committed checkout
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_BASE_COMMIT: ${{ inputs.candidate_base_commit }}
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          candidate_version="${CANDIDATE_VERSION:-$(node -p 'require("./package.json").version')}"
          python3 scripts/build_development_candidate.py build \
          --version "${candidate_version}" \
          --commit "${CANDIDATE_COMMIT}" \
          --base-commit "${CANDIDATE_BASE_COMMIT:-$CANDIDATE_COMMIT}" \
          --repository "${GITHUB_REPOSITORY}" \
          --goreleaser "${GITHUB_WORKSPACE}/bin/goreleaser" \
          --work-dir "${RUNNER_TEMP}/candidate-work" \
          --output-dir "${RUNNER_TEMP}/candidate-payload" \
          --receipt "${RUNNER_TEMP}/candidate-build-receipt.json"

      - name: Upload the immutable candidate payload
        id: candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-payload/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Retain the sanitized build receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-candidate-build-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-build-receipt.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false

  development-candidate-install:
    name: Distribution install (${{ matrix.os }}, ${{ matrix.channel }})
    needs: development-candidate
    if: >-
      ${{ !inputs.native_startup_component_only && ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_candidate && github.ref_type == 'branch')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # Download the exact distribution artifact produced by this run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        channel: [shell, npm, homebrew]
        include:
          - os: ubuntu-24.04
            host_os: Linux
            host_arch: amd64
          - os: macos-15
            host_os: Darwin
            host_arch: arm64
    steps:
      - name: Checkout the source commit the candidate was built from
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Require the intended native platform
        env:
          EXPECTED_OS: ${{ matrix.host_os }}
          EXPECTED_ARCH: ${{ matrix.host_arch }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.delegate_acceptance.release_verification.assets import platform_identity

          observed = platform_identity()
          print(f"observed {observed['os']} {observed['arch']} kernel {observed['kernel']}")
          expected = (os.environ["EXPECTED_OS"], os.environ["EXPECTED_ARCH"])
          if (observed["os"], observed["arch"]) != expected:
              sys.exit(f"intended {expected[0]} {expected[1]}, observed {observed['os']} {observed['arch']}")
          PY

      - name: Expose the preinstalled Linux Homebrew
        if: ${{ matrix.host_os == 'Linux' && matrix.channel == 'homebrew' }}
        run: |
          brew_bin=/home/linuxbrew/.linuxbrew/bin
          test -x "${brew_bin}/brew"
          echo "${brew_bin}" >> "${GITHUB_PATH}"

      - name: Prove the candidate install through the channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
          ARTIFACT_ID: ${{ needs.development-candidate.outputs.artifact-id }}
        run: >-
          python3 scripts/prove_candidate_install.py
          --artifact-id "${ARTIFACT_ID}"
          --channel "${CHANNEL}"
          --output-dir "${RUNNER_TEMP}/candidate-install-proof"
          --github-auth environment

      - name: Retain the install proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-install-${{ matrix.os }}-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-install-proof/receipt.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

  ccr:
    name: CCR integration
    needs: changes
    if: ${{ !inputs.native_startup_component_only && needs.changes.outputs.full == 'true' }}
    uses: ./.github/workflows/ccr-integration.yml
