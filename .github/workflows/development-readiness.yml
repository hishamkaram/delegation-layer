name: Development readiness

# Trusted-main observation only. One dispatch reads one pull request's actual head B, its tree T
# and the candidate store head, evaluates canonical readiness of the selected frozen candidate and
# posts the "Development readiness" status on B. It never checks out or runs pull request or
# candidate code, downloads artifacts, writes the store or reads rules, and grants no merge or
# publication authority. A merged pull request is an after-merge observation, never pre-merge
# enforcement.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Pull request number to observe'
        required: true
        type: string
      candidate_id:
        description: 'Full candidate ID (manifest SHA-256) frozen for that pull request'
        required: true
        type: string
      freeze_commit:
        description: 'Exact full store commit that froze the candidate (F)'
        required: true
        type: string

permissions: {}

jobs:
  development-readiness:
    name: Development readiness
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      PULL_REQUEST: ${{ inputs.pull_request }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      FREEZE_COMMIT: ${{ inputs.freeze_commit }}
    steps:
      - name: Checkout the exact trusted main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Verify the run binding and dispatch inputs
        run: |
          refuse() { echo "::error::$1" >&2; exit 1; }
          [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] || refuse "unexpected event: ${GITHUB_EVENT_NAME}"
          [ "${GITHUB_REF}" = refs/heads/main ] || refuse "unexpected ref: ${GITHUB_REF}"
          [ "${GITHUB_WORKFLOW_REF}" = "${GITHUB_REPOSITORY}/.github/workflows/development-readiness.yml@refs/heads/main" ] ||
            refuse "unexpected workflow ref: ${GITHUB_WORKFLOW_REF}"
          [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ] || refuse "checkout is not the run commit"
          [[ "${PULL_REQUEST}" =~ ^[1-9][0-9]{0,9}$ ]] || refuse "pull_request must be a positive decimal number"
          [[ "${CANDIDATE_ID}" =~ ^[0-9a-f]{64}$ ]] || refuse "candidate_id must be 64 lowercase hex characters"
          [[ "${FREEZE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || refuse "freeze_commit must be 40 lowercase hex characters"
          mkdir "${RUNNER_TEMP}/development-readiness"

      - name: Observe readiness and post the status on the pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python3 -B -P scripts/check_candidate_readiness.py
          --pull-request "${PULL_REQUEST}"
          --candidate-id "${CANDIDATE_ID}"
          --freeze-commit "${FREEZE_COMMIT}"
          --output-dir "${RUNNER_TEMP}/development-readiness"

      - name: Retain the readiness receipt and status request bodies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-readiness/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
