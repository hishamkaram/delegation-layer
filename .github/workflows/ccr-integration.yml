name: CCR integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foreground:
    name: CCR foreground (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          repository: hishamkaram/claude-code-router
          ref: 51ca1381f954162aced231d58176783c610fc882
          path: .local/ccr
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - name: Build CCR
        run: go build -C .local/ccr -o "$GITHUB_WORKSPACE/bin/ccr" ./cmd/ccr
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
      - name: Install locked Claude Code and test supervisor
        run: |
          provider_dir="$RUNNER_TEMP/ccr-provider"
          mkdir -p "$provider_dir"
          cp tools/ccr-provider/package.json tools/ccr-provider/package-lock.json "$provider_dir/"
          # The reviewed postinstall places the locked native binary at Claude's entrypoint.
          npm ci --prefix "$provider_dir" --include=optional --ignore-scripts=false --no-audit --no-fund
          expected_version="$(node --print "require(process.argv[1]).dependencies['@anthropic-ai/claude-code']" "$provider_dir/package.json")"
          actual_version="$("$provider_dir/node_modules/.bin/claude" --version)"
          if [ "$actual_version" != "$expected_version (Claude Code)" ]; then
            printf 'Expected Claude Code %s; received %s\n' "$expected_version" "$actual_version" >&2
            exit 1
          fi
          printf '%s\n' "$actual_version"
          echo "$provider_dir/node_modules/.bin" >> "$GITHUB_PATH"
          ./scripts/install-test-supervisor.sh
      - name: Build Delegate
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -ldflags "-X main.version=dev" -o bin/delegate ./cmd/delegate
          CGO_ENABLED=0 go build -buildvcs=false -ldflags "-X main.version=dev" -o bin/delegate-run ./cmd/delegate-run
          CGO_ENABLED=0 go test -c -buildvcs=false -o bin/nested-lifetime-fixture ./internal/lifetime
          CGO_ENABLED=0 go test -c -buildvcs=false -o bin/task-inventory-fixture ./internal/taskdir
      - name: Prove foreground lifecycle using real CLIs
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$GITHUB_WORKSPACE/bin/test-supervisor:$PATH"
          # Prove the native ps format/Wait before the failure-only diagnostic consumer runs.
          python3 -m unittest discover -s scripts -p test_acceptance_ccr_fixture.py -k native_cpu_snapshot -v
          python3 scripts/acceptance_ccr_fixture.py --output "$HOME/ccr-integration-evidence"
          python3 scripts/acceptance_ccr_fixture.py --refusal-cleanup --output "$HOME/ccr-refusal-cleanup-evidence"
      - name: Retain sanitized result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ccr-integration-${{ runner.os }}
          # Existing public control records preserve refusals without raw streams or profiles.
          path: |
            ~/ccr-integration-evidence/success.json
            ~/ccr-integration-evidence/*-dispatch-attempt.json
            ~/ccr-integration-evidence/*-continue-attempt.json
            ~/ccr-integration-evidence/failure-diagnostics.json
            ~/ccr-integration-evidence/failure-host-cpu-snapshot.json
            ~/ccr-integration-evidence/failure-cleanup.json
            ~/ccr-integration-evidence/failure-cleanup-expired.json
            ~/ccr-refusal-cleanup-evidence/success.json
            ~/ccr-refusal-cleanup-evidence/cleanup.json
            ~/ccr-refusal-cleanup-evidence/*-dispatch-attempt.json
            ~/ccr-refusal-cleanup-evidence/failure-diagnostics.json
            ~/ccr-refusal-cleanup-evidence/failure-cleanup.json
            ~/ccr-refusal-cleanup-evidence/failure-cleanup-expired.json
          if-no-files-found: warn
