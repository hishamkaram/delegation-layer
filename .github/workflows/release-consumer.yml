name: Published release consumer

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      channel:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  consumer:
    name: Published ${{ inputs.channel }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - name: Initialize partial-publication failure receipt before setup
        env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'schema_version': 1, 'gate': 'published-install',
                     'tag': os.environ['TAG'], 'channel': os.environ['CHANNEL'],
                     'harness_revision': os.environ['GITHUB_SHA'],
                     'verdict': 'fail', 'stage': 'prepare-consumer',
                     'publication': 'partial',
                     'failure': {'code': 'published_verification_incomplete'}}
          Path(os.environ['RUNNER_TEMP'], 'published-install-setup-failure.json').write_text(json.dumps(receipt))
          PY
      - name: Checkout trusted consumer verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
      - name: Bind exact archive bytes and tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          archive_name="$(python3 -c 'import os; from scripts.delegate_acceptance.release_verification.assets import platform_identity; from scripts.delegate_acceptance.release_verification.contract import expected_archive; print(expected_archive(platform_identity(), os.environ["TAG"]))')"
          mkdir -p "${RUNNER_TEMP}/delegation-layer-release"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive_name}" --pattern checksums.txt \
            --dir "${RUNNER_TEMP}/delegation-layer-release"
          python3 scripts/verify_release_archive.py verify --mode native-acceptance \
            --assets-dir "${RUNNER_TEMP}/delegation-layer-release" \
            --extract-dir "${RUNNER_TEMP}/delegation-layer-release/extracted" \
            --receipt "${RUNNER_TEMP}/consumer-archive-receipt.json" \
            --tag "${TAG}" --repo "${GITHUB_REPOSITORY}" --source-revision "${GITHUB_SHA}"
      - name: Prove anonymous published installation
        env:
          # Used only for source metadata. The verifier strips tokens from
          # every npm, installed CLI and Brew consumer environment.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 scripts/verify_release_archive.py published \
            --channel "${CHANNEL}" --tag "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --source-revision "${GITHUB_SHA}" \
            --archive-receipt "${RUNNER_TEMP}/consumer-archive-receipt.json" \
            --extract-dir "${RUNNER_TEMP}/delegation-layer-release/extracted" \
            --receipt "${RUNNER_TEMP}/published-install-receipt.json"
      - name: Select consumer report without replacing verifier state
        id: consumer-report
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          receipt = root / 'published-install-receipt.json'
          report = receipt if receipt.is_file() else root / 'published-install-setup-failure.json'
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'path={report}\n')
          PY
      - name: Retain consumer result, including partial publication failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-install-${{ inputs.channel }}-${{ inputs.os }}-${{ github.run_attempt }}
          path: ${{ steps.consumer-report.outputs.path }}
          if-no-files-found: error
          retention-days: 30
