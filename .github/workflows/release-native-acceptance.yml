name: Release native acceptance

run-name: Native proof ${{ inputs.tag }} ${{ inputs.invocation_id }} ${{ inputs.proof_sha256 }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag bound to the maintainer native proof'
        required: true
        type: string
      proof_asset_id:
        description: 'Exact release asset ID uploaded by the maintainer'
        required: true
        type: string
      proof_sha256:
        description: 'SHA256 of the public proof ZIP'
        required: true
        type: string
      invocation_id:
        description: 'Unique local invocation ID'
        required: true
        type: string
      opencode_model:
        description: 'Exact OpenCode model recorded in the proof'
        required: true
        type: string
      ccr_model:
        description: 'Exact CCR alias, or empty for explicit missing-option BLOCKED'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Validate maintainer-attested native proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Draft assets require push access. This hosted job has no provider secrets.
      contents: write
      actions: read
      attestations: read
    steps:
      - name: Initialize failure report before setup
        env:
          TAG: ${{ inputs.tag }}
          PROOF_SHA256: ${{ inputs.proof_sha256 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/native-proof"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
          report = {'schema_version': 1, 'kind': 'native-proof-validation',
                    'repository_id': event['repository']['id'], 'tag': os.environ['TAG'],
                    'harness_revision': os.environ['GITHUB_SHA'],
                    'run_id': int(os.environ['GITHUB_RUN_ID']),
                    'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                    'proof_sha256': os.environ['PROOF_SHA256'],
                    'admission': 'unknown', 'verdict': 'incomplete', 'stage': 'setup'}
          Path(os.environ['RUNNER_TEMP'], 'native-proof', 'report.json').write_text(json.dumps(report))
          PY

      - name: Checkout trusted validation harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Verify identity, proof bytes, native facts and complete history
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PROOF_ASSET_ID: ${{ inputs.proof_asset_id }}
          PROOF_SHA256: ${{ inputs.proof_sha256 }}
          INVOCATION_ID: ${{ inputs.invocation_id }}
          OPENCODE_MODEL: ${{ inputs.opencode_model }}
          CCR_MODEL: ${{ inputs.ccr_model }}
        run: |
          python3 scripts/validate_native_release.py validate \
            --tag "${TAG}" --asset-id "${PROOF_ASSET_ID}" \
            --proof-sha256 "${PROOF_SHA256}" --invocation-id "${INVOCATION_ID}" \
            --opencode-model "${OPENCODE_MODEL}" --ccr-model "${CCR_MODEL}" \
            --report "${RUNNER_TEMP}/native-proof/report.json"

      - name: Retain exact attempt validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-proof-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-proof/report.json
          retention-days: 90
          if-no-files-found: error
