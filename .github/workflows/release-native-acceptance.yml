name: Release native acceptance

run-name: Native acceptance ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag to test, for example v1.2.3'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  retrieve:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Retrieve draft release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # GitHub only lists draft releases to callers with push access. This
      # short hosted job does not check out or execute repository code.
      contents: write
      attestations: read
    steps:
      - name: Download the exact draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Only stable semantic version tags such as v1.2.3 can be tested." >&2
            exit 1
          fi
          release_dir="${RUNNER_TEMP}/delegation-layer-release"
          mkdir -p "${release_dir}"
          release_id="$(gh api "repos/${GH_REPO}/releases?per_page=100" \
            --paginate \
            --jq '.[] | select(.draft == true and .tag_name == "'"${TAG}"'") | .id')"
          if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "Draft release ${TAG} was not found." >&2
            exit 1
          fi
          asset_count=0
          while IFS=$'\t' read -r asset asset_id; do
            [[ -n "${asset}" && -n "${asset_id}" ]] || continue
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/${GH_REPO}/releases/assets/${asset_id}" >"${release_dir}/${asset}"
            asset_count=$((asset_count + 1))
          done < <(gh api "repos/${GH_REPO}/releases/${release_id}/assets?per_page=100" \
            --paginate \
            --jq '.[] | select(.name == "checksums.txt" or (.name | (startswith("delegation-layer_") and endswith(".tar.gz")))) | [.name, (.id | tostring)] | @tsv')
          if (( asset_count < 2 )) || [[ ! -s "${release_dir}/checksums.txt" ]]; then
            echo "Draft release ${TAG} did not provide checksums and release archives." >&2
            exit 1
          fi

      - name: Transfer exact release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets-${{ inputs.tag }}
          path: ${{ runner.temp }}/delegation-layer-release
          if-no-files-found: error
          retention-days: 7

  native:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Authenticated native acceptance
    needs: retrieve
    # This runner is intentionally managed by the project owner. Provider
    # CLIs and their native login state must never be copied into GitHub data.
    runs-on: [self-hosted, delegation-native]
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Checkout the current acceptance harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The release artifact is verified and executed below. Keep the
          # harness on protected main so acceptance fixes apply to existing
          # draft tags as well as newly created releases.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets-${{ inputs.tag }}
          path: ${{ runner.temp }}/delegation-layer-release

      - name: Verify the exact release archive and packaged default path
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RECEIPT: ${{ runner.temp }}/delegation-layer-archive-receipt.json
        shell: bash
        run: |
          python3 scripts/verify_release_archive.py verify \
            --mode native-acceptance \
            --assets-dir "${RUNNER_TEMP}/delegation-layer-release" \
            --extract-dir "${RUNNER_TEMP}/delegation-layer-release/extracted" \
            --receipt "${RECEIPT}" \
            --tag "${TAG}" \
            --repo "${GH_REPO}" \
            --source-revision "${GITHUB_SHA}"

      - name: Configure OpenCode tool-capable acceptance model
        shell: bash
        run: |
          # Use OpenCode's own tool-capable model so acceptance does not depend
          # on an account-specific OpenRouter endpoint policy.
          model='opencode/big-pickle'
          config="${RUNNER_TEMP}/opencode-acceptance.json"
          printf '%s\n' "{\"model\":\"${model}\"}" >"${config}"
          chmod 0600 "${config}"
          printf 'OPENCODE_CONFIG=%s\n' "${config}" >>"${GITHUB_ENV}"
          printf 'OPENCODE_LIVE_MODEL=%s\n' "${model}" >>"${GITHUB_ENV}"

      - name: Prove the released CLI with authenticated native providers
        id: native_live
        env:
          DELEGATE_ACCEPTANCE_BIN_DIR: ${{ runner.temp }}/delegation-layer-release/extracted
          DELEGATE_ACCEPTANCE_OUTPUT_ROOT: ${{ github.workspace }}/.native-acceptance/native-aggregate-${{ github.run_id }}
          DELEGATE_ACCEPTANCE_TAG: ${{ inputs.tag }}
          DELEGATE_ACCEPTANCE_SOURCE_REVISION: ${{ github.sha }}
          DELEGATE_ACCEPTANCE_RESOLVED_RETENTION: '3'
          DELEGATION_REQUIRE_LIVE_ACCEPTANCE: '1'
          EXIT_CODE_FILE: ${{ runner.temp }}/delegation-layer-native-acceptance.exit
        run: |
          export PATH="${DELEGATE_ACCEPTANCE_BIN_DIR}:${PATH}"
          set -eu
          if ./scripts/acceptance_native_all.sh; then
            exit_code=0
          else
            exit_code=$?
          fi
          printf '%s\n' "${exit_code}" > "${EXIT_CODE_FILE}"
          exit "${exit_code}"

      - name: Finalize the native package identity receipt
        if: always()
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          ACCEPTANCE_OUTCOME: ${{ steps.native_live.outcome }}
          ARCHIVE_RECEIPT: ${{ runner.temp }}/delegation-layer-archive-receipt.json
          NATIVE_RECEIPT: ${{ runner.temp }}/delegation-layer-native-acceptance-receipt.json
          AGGREGATE_RECEIPT: ${{ github.workspace }}/.native-acceptance/native-aggregate-${{ github.run_id }}/aggregate-receipt.json
          EXIT_CODE_FILE: ${{ runner.temp }}/delegation-layer-native-acceptance.exit
        shell: bash
        run: |
          python3 scripts/verify_release_archive.py finalize-native \
            --archive-receipt "${ARCHIVE_RECEIPT}" \
            --aggregate-receipt "${AGGREGATE_RECEIPT}" \
            --assets-dir "${RUNNER_TEMP}/delegation-layer-release" \
            --extract-dir "${RUNNER_TEMP}/delegation-layer-release/extracted" \
            --receipt "${NATIVE_RECEIPT}" \
            --exit-code-file "${EXIT_CODE_FILE}" \
            --acceptance-outcome "${ACCEPTANCE_OUTCOME:-skipped}" \
            --tag "${TAG}" \
            --repo "${REPO}" \
            --source-revision "${SOURCE_REVISION}"

      - name: Stage exact sanitized native evidence
        if: always()
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_REVISION: ${{ github.sha }}
          STAGED_EVIDENCE: ${{ runner.temp }}/native-acceptance-evidence
          ARCHIVE_RECEIPT: ${{ runner.temp }}/delegation-layer-archive-receipt.json
          NATIVE_RECEIPT: ${{ runner.temp }}/delegation-layer-native-acceptance-receipt.json
          AGGREGATE_RECEIPT: ${{ github.workspace }}/.native-acceptance/native-aggregate-${{ github.run_id }}/aggregate-receipt.json
        shell: bash
        run: |
          if python3 scripts/native_acceptance_evidence.py stage \
            --aggregate-receipt "${AGGREGATE_RECEIPT}" \
            --output "${STAGED_EVIDENCE}" \
            --archive-receipt "${ARCHIVE_RECEIPT}" \
            --native-receipt "${NATIVE_RECEIPT}" \
            --tag "${TAG}" \
            --source-revision "${SOURCE_REVISION}"; then
            :
          else
            stage_status=$?
            echo "sanitized native evidence staging failed exit=${stage_status}" >&2
            exit "${stage_status}"
          fi

      - name: Retain the sanitized native acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-native-acceptance-receipt-${{ inputs.tag }}
          path: ${{ runner.temp }}/native-acceptance-evidence
          if-no-files-found: error
          retention-days: 30
