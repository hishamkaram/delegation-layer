name: Release native acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag to test, for example v1.2.3'
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  native:
    name: Authenticated native acceptance
    # This runner is intentionally managed by the project owner. Provider
    # CLIs and their native login state must never be copied into GitHub data.
    runs-on: [self-hosted, delegation-native]
    timeout-minutes: 90
    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download and verify the exact release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Only stable semantic version tags such as v1.2.3 can be tested." >&2
            exit 1
          fi
          release_dir="${RUNNER_TEMP}/delegation-layer-release"
          mkdir -p "${release_dir}"
          gh release download "${TAG}" \
            --repo "${GH_REPO}" \
            --pattern 'delegation-layer_*.tar.gz' \
            --pattern checksums.txt \
            --dir "${release_dir}"
          cd "${release_dir}"
          case "$(uname -s)" in
            Linux) os=Linux ;;
            Darwin) os=Darwin ;;
            *) echo "Unsupported operating system: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="delegation-layer_${TAG#v}_${os}_${arch}.tar.gz"
          test -f "${archive}"
          checksum_line="$(grep -F "  ${archive}" checksums.txt)"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s\n' "${checksum_line}" | sha256sum -c -
          else
            printf '%s\n' "${checksum_line}" | shasum -a 256 -c -
          fi
          gh attestation verify "${archive}" \
            --repo "${GH_REPO}" \
            --signer-workflow "${GH_REPO}/.github/workflows/release.yml"
          artifact_dir="${release_dir}/extracted"
          mkdir -p "${artifact_dir}"
          tar -xzf "${archive}" -C "${artifact_dir}"
          test -x "${artifact_dir}/delegate"
          test -x "${artifact_dir}/delegate-run"
          test -x "${artifact_dir}/pueue"
          test -x "${artifact_dir}/pueued"
          printf '%s\n' "${artifact_dir}" > "${RUNNER_TEMP}/delegation-layer-artifact-dir"

      - name: Prove the released CLI with authenticated native providers
        env:
          DELEGATE_ACCEPTANCE_BIN_DIR: ${{ runner.temp }}/delegation-layer-release/extracted
          DELEGATION_REQUIRE_LIVE_ACCEPTANCE: '1'
        run: |
          export PATH="${DELEGATE_ACCEPTANCE_BIN_DIR}:${PATH}"
          ./scripts/acceptance_native_all.sh
